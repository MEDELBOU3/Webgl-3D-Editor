<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--lw:230px;--rw:300px;--bh:190px;--b1:#282828;--b2:#383838;--b3:#464646;--bd:#191919;--tx:#c8c8c8;--mu:#8a8a8a;--ac:#2c5d87;--ac2:#3d7cb8}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
[hidden]{display:none!important}
body{font:11px/1.2 Inter,system-ui,sans-serif;color:var(--tx);background:var(--b2);height:100vh;overflow:hidden}
#app{display:grid;grid-template-rows:22px 32px 1fr var(--bh) 20px;height:100vh}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
#menubar{background:#1f1f1f;display:flex;border-bottom:1px solid var(--bd)}
.menu{position:relative;padding:5px 10px}.menu:hover{background:var(--b3)}
.dd{display:none;position:absolute;top:100%;left:0;min-width:210px;background:#2d2d2d;border:1px solid #111;box-shadow:0 4px 12px #0008;z-index:99;padding:3px 0}
.menu:hover>.dd{display:block}.dd div{padding:4px 18px}.dd div:hover{background:var(--ac)}.dd hr{border:0;border-top:1px solid #444;margin:3px 0}
#toolbar{display:flex;align-items:center;padding:0 8px;gap:12px;background:var(--b1);border-bottom:1px solid var(--bd)}
body.playing #toolbar{background:#2f3f58}
.grp{display:flex;gap:2px}.grow{flex:1}
.tb{height:24px;min-width:26px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;background:#4b4b4b;border:1px solid #1d1d1d;border-radius:3px;color:var(--tx);font:inherit;cursor:pointer}
.tb:hover{background:#585858}.tb.on{background:var(--ac);border-color:#1d4468;color:#fff}
#main{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);min-height:0}
.panel{position:relative;background:var(--b2);display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--bd)}
.tabs{display:flex;background:var(--b1);height:21px;border-bottom:1px solid var(--bd);flex:none}
.tab{padding:0 11px;display:flex;gap:5px;align-items:center;color:var(--mu);cursor:pointer}
.tab.on{background:var(--b2);color:var(--tx);border-top:1px solid var(--ac2)}
.body{flex:1;overflow:auto;min-height:0}
#hsearch{display:flex;gap:4px;padding:4px;border-bottom:1px solid var(--bd);align-items:center}
.row{display:flex;align-items:center;gap:6px;height:20px;padding:0 8px;cursor:default}
.row:hover{background:#4a4a4a}.row.sel{background:var(--ac);color:#fff}.row .eye{margin-left:auto;opacity:.6;cursor:pointer}
#vp{position:relative;flex:1;min-height:0;background:#222;overflow:hidden}#cv{display:block}
#stats{position:absolute;left:8px;top:8px;background:#000a;padding:4px 8px;border-radius:3px;font:10px ui-monospace,monospace;pointer-events:none}
#axg{position:absolute;right:8px;top:8px;width:70px;height:70px;pointer-events:none}
.oh{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--bd);background:#3c3c3c}
.comp{border-bottom:1px solid var(--bd)}
.ch{background:#404040;padding:4px 6px;display:flex;gap:6px;align-items:center;font-weight:600}
.cb{padding:6px 8px;display:grid;gap:5px}
.f{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:6px;min-height:18px}.f>label{color:#b0b0b0}
.v3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.ax{display:flex;align-items:center;gap:3px}.ax b{width:9px;font-weight:700;text-align:center}
input[type=number],input[type=text],select{width:100%;height:18px;background:#2a2a2a;border:1px solid #1c1c1c;border-radius:2px;color:var(--tx);font:inherit;padding:0 4px;outline:0;user-select:text}
textarea{width:100%;background:#202020;border:1px solid #1c1c1c;color:#d6e4c0;font:11px/1.35 ui-monospace,monospace;padding:4px;outline:0;user-select:text;resize:vertical;tab-size:2}
input:focus,select:focus,textarea:focus{border-color:var(--ac2)}
input[type=range]{width:100%;accent-color:#6a9bd0;height:14px}
input[type=color]{width:100%;height:18px;border:1px solid #1c1c1c;background:#2a2a2a;padding:0}
.x{margin-left:auto;cursor:pointer;opacity:.7}.x svg{transform:rotate(45deg)}
.empty{color:var(--mu);padding:20px;text-align:center}
.btns{display:flex;gap:3px;flex-wrap:wrap}.btns button{flex:1;height:20px;background:#4b4b4b;border:1px solid #1d1d1d;border-radius:2px;color:var(--tx);font:inherit;cursor:pointer}.btns button:hover{background:var(--ac)}
.assets{display:flex;flex-wrap:wrap;gap:10px;padding:10px}.tile{width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:3px;cursor:pointer}.tile:hover{background:#4a4a4a}.tile svg{width:30px;height:30px}
.ln{padding:3px 8px;border-bottom:1px solid #303030;font:11px ui-monospace,monospace;user-select:text}.ln.warn{color:#e5c04a}.ln.err{color:#f26b6b}
.tr{display:flex;gap:3px;padding:3px 4px;align-items:center;border-bottom:1px solid #303030}.tr select,.tr input{flex:1;min-width:0}.tr button{width:20px;height:18px;background:#4b4b4b;border:1px solid #1d1d1d;color:var(--tx);cursor:pointer}
#status{background:#1f1f1f;border-top:1px solid var(--bd);display:flex;justify-content:space-between;padding:4px 10px;color:var(--mu)}
.rz{position:absolute;z-index:20}.rz:hover,.rz.on{background:var(--ac2)}
.rzr{right:-3px;top:0;bottom:0;width:6px;cursor:ew-resize}.rzl{left:-3px;top:0;bottom:0;width:6px;cursor:ew-resize}.rzt{top:-3px;left:0;right:0;height:6px;cursor:ns-resize}
#ce{position:absolute;inset:0;background:#1e1e1e;display:flex;flex-direction:column;z-index:5}#ce textarea{flex:1;border:0;border-radius:0;font-size:12px;resize:none;padding:8px}
.ceh{display:flex;gap:6px;align-items:center;padding:5px 8px;background:#2d2d2d;border-bottom:1px solid #111}
</style></head><body class="">
<div id="app">
<div id="menubar"></div>
<div id="toolbar"></div>
<div id="main">
 <section class="panel"><div class="rz rzr" data-rz="l"></div><div class="tabs"><div class="tab on"><i data-ic="grid"></i>Hierarchy</div></div>
  <div id="hsearch"><i data-ic="search"></i><input id="hq" type="text" placeholder="Search"><button class="tb" id="hadd" title="Add Cube"><i data-ic="plus"></i></button></div>
  <div class="body" id="hier"></div></section>
 <section class="panel"><div class="tabs"><div class="tab on" data-v="scene"><i data-ic="cube"></i>Scene</div><div class="tab" data-v="game"><i data-ic="cam"></i>Game</div><div class="tab" data-v="code"><i data-ic="gear"></i>Code</div></div>
  <div id="vp"><canvas id="cv"></canvas><svg id="axg" viewBox="0 0 70 70"></svg><div id="stats"></div><div id="ce" hidden></div></div></section>
 <section class="panel"><div class="rz rzl" data-rz="r"></div><div class="tabs"><div class="tab on" data-p="insp"><i data-ic="gear"></i>Inspector</div><div class="tab" data-p="light"><i data-ic="sun"></i>Lighting</div></div>
  <div class="body" id="insp"></div><div class="body" id="light" hidden></div></section>
</div>
<section class="panel"><div class="rz rzt" data-rz="b"></div><div class="tabs"><div class="tab on" data-b="proj"><i data-ic="folder"></i>Project</div><div class="tab" data-b="cons"><i data-ic="terminal"></i>Console</div><div class="tab" data-b="anim"><i data-ic="bolt"></i>Animator</div><div class="tab" data-b="tnode"><i data-ic="cone"></i>Terrain Nodes</div></div>
 <div class="body" id="proj"></div><div class="body" id="cons" hidden></div><div class="body" id="anim" hidden></div><div class="body" id="tnode" hidden></div></section>
<div id="status"><span></span><span id="sinfo"></span></div>
</div>
<input type="file" id="fl" accept=".json" hidden>
<input type="file" id="fm" accept=".glb,.gltf,.obj,.fbx,.stl,.png,.jpg,.jpeg,.webp,.gif" multiple hidden>

$('#insp').addEventListener('click',ev=>{const b=ev.target.closest('[data-ter]');if(b&&sel&&sel.ter)terAct(b.dataset.ter)});
/* node editor */
function buildTN(){const e=sel,h=$('#tnode');if(!e||!e.ter){h.innerHTML='<div class="empty">Select a Terrain to edit its node graph</div>';return}
 const t=e.ter,nd=t.nodes[t.sn],L=t.nodes.map((x,i)=>[i,i+' '+x.type]).slice(0,t.sn),sp=nd&&SPEC[nd.type];
 h.innerHTML=`<div style="display:flex;height:100%"><svg id="tg" style="flex:1;min-width:0;height:100%;background:#262626"></svg><div style="width:300px;overflow:auto;border-left:1px solid #191919;padding:4px">`
 +(nd?`<div class="tr"><b>${t.sn} · ${nd.type}</b></div>`+(sp.in>0?`<div class="tr">A<select data-tn=a>${OP([[-1,'(none)'],...L],nd.a)}</select>`+(sp.in>1?`B<select data-tn=b>${OP([[-1,'(none)'],...L],nd.b)}</select>`:'')+'</div>':'')+Object.entries(nd.p).map(([k,v])=>`<div class="tr"><span style="width:50px">${k}</span><input type=number step=any data-tp="${k}" value="${v}"></div>`).join('')+'<div class="btns"><button data-tn=del>Delete node</button></div>':'')
 +`<div class="tr"><select id="tnt">${Object.keys(SPEC).map(k=>`<option>${k}</option>`).join('')}</select><button data-tn=add style="max-width:36px">+</button></div><div class="btns"><button data-tn=gen>▶ Generate Terrain</button></div><div style="color:var(--mu);padding:4px">Click node to edit · drag to move · edits regenerate live (overwrites sculpting)</div></div></div>`;drawTG()}
function drawTG(){const e=sel,g=$('#tg');if(!g||!e||!e.ter)return;const t=e.ter,ns=t.nodes;
 g.innerHTML=ns.map((n,i)=>[n.a,n.b].slice(0,SPEC[n.type].in).map(s=>s>=0&&s<i&&ns[s]?`<path d="M${ns[s].x+100} ${ns[s].y+16}C${ns[s].x+140} ${ns[s].y+16},${n.x-40} ${n.y+16},${n.x} ${n.y+16}" fill="none" stroke="#8ab"/>`:'').join('')).join('')
 +ns.map((n,i)=>`<g data-n="${i}" style="cursor:grab"><rect x="${n.x}" y="${n.y}" width="100" height="32" rx="3" fill="${i===t.sn?'#c8741a':n.type==='out'?'#2d6a4f':'#4b4b4b'}" stroke="#111"/><text x="${n.x+50}" y="${n.y+20}" text-anchor="middle" fill="#fff" font-size="10">${i} ${n.type}</text></g>`).join('')}
let td=null,tgT;const regen=()=>{clearTimeout(tgT);tgT=setTimeout(()=>{if(sel&&sel.ter){terGen(sel);commit()}},300)};
$('#tnode').addEventListener('pointerdown',ev=>{const n=ev.target.closest('[data-n]');if(n&&sel&&sel.ter)td={i:+n.dataset.n,m:0}});
$('#tnode').addEventListener('pointermove',ev=>{if(!td||!sel||!sel.ter)return;td.m+=Math.abs(ev.movementX)+Math.abs(ev.movementY);const nd=sel.ter.nodes[td.i];nd.x+=ev.movementX;nd.y+=ev.movementY;drawTG()});
addEventListener('pointerup',()=>{if(td&&sel&&sel.ter){if(td.m<4)sel.ter.sn=td.i;buildTN()}td=null});
$('#tnode').addEventListener('change',ev=>{const t=ev.target,T=sel&&sel.ter;if(!T)return;const nd=T.nodes[T.sn];if(t.dataset.tn==='a'||t.dataset.tn==='b'){nd[t.dataset.tn]=+t.value;drawTG();regen()}else if(t.dataset.tp){nd.p[t.dataset.tp]=+t.value;regen()}});
$('#tnode').addEventListener('click',ev=>{const b=ev.target.closest('button[data-tn]'),T=sel&&sel.ter;if(!b||!T)return;const k=b.dataset.tn;
 if(k==='gen'){terGen(sel);commit()}
 else if(k==='add'){const ty=$('#tnt').value,L=T.nodes.length;T.nodes.push({type:ty,p:{...SPEC[ty].p},a:SPEC[ty].in?L-1:-1,b:-1,x:12+L%4*118,y:10+(L/4|0)*46});T.sn=L;buildTN()}
 else if(k==='del'&&T.nodes.length>1){const i=T.sn;T.nodes.splice(i,1);T.nodes.forEach(n=>{for(const q of['a','b'])n[q]=n[q]===i?-1:n[q]>i?n[q]-1:n[q]});T.sn=Math.min(i,T.nodes.length-1);buildTN();regen()}});
/* ---------- boot ---------- */
applyEnv();buildLight();
make({n:'Ground',t:'plane',p:[0,0,0],s:[40,1,40],c:'#6b7a55',ro:.95,me:0});
make({n:'Cube',t:'cube',p:[-2.5,.5,0],c:'#c0553d'});
make({n:'Chrome Sphere',t:'sphere',p:[0,.5,1],c:'#e9c46a',ro:.2,me:.9});
make({n:'Cylinder',t:'cylinder',p:[2.5,.5,-.5],c:'#4a8fd0'});
make({n:'Spinner',t:'torus',p:[0,2.5,-2],r:[1.2,0,0],c:'#b57edc',ro:.3,me:.6,sp:60});
make({n:'Falling Ball',t:'sphere',p:[-.5,6,.5],c:'#f4f4f4',rb:true});
make({n:'Player',t:'player',p:[0,.9,4],s:[.8,1.8,.8],c:'#4a8fd0',rb:true,x:{pl:{speed:5,jump:7}}});
make({n:'Follow Camera',t:'camera',p:[0,3,10],x:{cm:{mode:'follow',target:'Player',dist:6,h:2,fov:60}}});
commit();setTool('translate');setView('scene');buildHier();buildInsp();buildAnim();log('Apex Engine ready. Press Play, then WASD + Space to move the Player.');frame();buildProj();buildTN();restore();
</script></body></html>
