<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--b1:#282828;--b2:#383838;--b3:#464646;--bd:#191919;--tx:#c8c8c8;--mu:#8a8a8a;--ac:#2c5d87;--ac2:#3d7cb8}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
[hidden]{display:none!important}
body{font:11px/1.2 Inter,system-ui,sans-serif;color:var(--tx);background:var(--b2);height:100vh;overflow:hidden}
#app{display:grid;grid-template-rows:22px 32px 1fr 190px 20px;height:100vh}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
#menubar{background:#1f1f1f;display:flex;border-bottom:1px solid var(--bd)}
.menu{position:relative;padding:5px 10px}.menu:hover{background:var(--b3)}
.dd{display:none;position:absolute;top:100%;left:0;min-width:190px;background:#2d2d2d;border:1px solid #111;box-shadow:0 4px 12px #0008;z-index:99;padding:3px 0}
.menu:hover>.dd{display:block}.dd div{padding:4px 18px}.dd div:hover{background:var(--ac)}.dd hr{border:0;border-top:1px solid #444;margin:3px 0}
#toolbar{display:flex;align-items:center;padding:0 8px;gap:12px;background:var(--b1);border-bottom:1px solid var(--bd)}
body.playing #toolbar{background:#2f3f58}
.grp{display:flex;gap:2px}.grow{flex:1}
.tb{height:24px;min-width:26px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;background:#4b4b4b;border:1px solid #1d1d1d;border-radius:3px;color:var(--tx);font:inherit;cursor:pointer}
.tb:hover{background:#585858}.tb.on{background:var(--ac);border-color:#1d4468;color:#fff}
#main{display:grid;grid-template-columns:230px 1fr 300px;min-height:0}
.panel{background:var(--b2);display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--bd)}
.tabs{display:flex;background:var(--b1);height:21px;border-bottom:1px solid var(--bd);flex:none}
.tab{padding:0 11px;display:flex;gap:5px;align-items:center;color:var(--mu);cursor:pointer}
.tab.on{background:var(--b2);color:var(--tx);border-top:1px solid var(--ac2)}
.body{flex:1;overflow:auto;min-height:0}
#hsearch{display:flex;gap:4px;padding:4px;border-bottom:1px solid var(--bd);align-items:center}
.row{display:flex;align-items:center;gap:6px;height:20px;padding:0 8px;cursor:default}
.row:hover{background:#4a4a4a}.row.sel{background:var(--ac);color:#fff}.row .eye{margin-left:auto;opacity:.6;cursor:pointer}
#vp{position:relative;flex:1;min-height:0;background:#222;overflow:hidden}#cv{display:block}
#stats{position:absolute;left:8px;top:8px;background:#000a;padding:4px 8px;border-radius:3px;font:10px ui-monospace,monospace;pointer-events:none}
#axg{position:absolute;right:8px;top:8px;width:70px;height:70px;pointer-events:none}
.oh{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--bd);background:#3c3c3c}
.comp{border-bottom:1px solid var(--bd)}
.ch{background:#404040;padding:4px 6px;display:flex;gap:6px;align-items:center;font-weight:600}
.cb{padding:6px 8px;display:grid;gap:5px}
.f{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:6px;min-height:18px}.f>label{color:#b0b0b0}
.v3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.ax{display:flex;align-items:center;gap:3px}.ax b{width:9px;font-weight:700;text-align:center}
input[type=number],input[type=text],select{width:100%;height:18px;background:#2a2a2a;border:1px solid #1c1c1c;border-radius:2px;color:var(--tx);font:inherit;padding:0 4px;outline:0;user-select:text}
input:focus,select:focus{border-color:var(--ac2)}
input[type=range]{width:100%;accent-color:#6a9bd0;height:14px}
input[type=color]{width:100%;height:18px;border:1px solid #1c1c1c;background:#2a2a2a;padding:0}
.x{margin-left:auto;cursor:pointer;opacity:.7}.x svg{transform:rotate(45deg)}
.empty{color:var(--mu);padding:20px;text-align:center}
.btns{display:flex;gap:3px;flex-wrap:wrap}.btns button{flex:1;height:20px;background:#4b4b4b;border:1px solid #1d1d1d;border-radius:2px;color:var(--tx);font:inherit;cursor:pointer}.btns button:hover{background:var(--ac)}
.assets{display:flex;flex-wrap:wrap;gap:10px;padding:10px}.tile{width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:3px;cursor:pointer}.tile:hover{background:#4a4a4a}.tile svg{width:30px;height:30px}
.ln{padding:3px 8px;border-bottom:1px solid #303030;font:11px ui-monospace,monospace;user-select:text}.ln.warn{color:#e5c04a}.ln.err{color:#f26b6b}
#status{background:#1f1f1f;border-top:1px solid var(--bd);display:flex;justify-content:space-between;padding:4px 10px;color:var(--mu)}
</style></head><body class="">
<div id="app">
<div id="menubar"></div>
<div id="toolbar"></div>
<div id="main">
 <section class="panel"><div class="tabs"><div class="tab on"><i data-ic="grid"></i>Hierarchy</div></div>
  <div id="hsearch"><i data-ic="search"></i><input id="hq" type="text" placeholder="Search"><button class="tb" id="hadd" title="Add Cube"><i data-ic="plus"></i></button></div>
  <div class="body" id="hier"></div></section>
 <section class="panel"><div class="tabs"><div class="tab on" data-v="scene"><i data-ic="cube"></i>Scene</div><div class="tab" data-v="game"><i data-ic="cam"></i>Game</div></div>
  <div id="vp"><canvas id="cv"></canvas><svg id="axg" viewBox="0 0 70 70"></svg><div id="stats"></div></div></section>
 <section class="panel"><div class="tabs"><div class="tab on" data-p="insp"><i data-ic="gear"></i>Inspector</div><div class="tab" data-p="light"><i data-ic="sun"></i>Lighting</div></div>
  <div class="body" id="insp"></div><div class="body" id="light" hidden></div></section>
</div>
<section class="panel"><div class="tabs"><div class="tab on" data-b="proj"><i data-ic="folder"></i>Project</div><div class="tab" data-b="cons"><i data-ic="terminal"></i>Console</div></div>
 <div class="body" id="proj"></div><div class="body" id="cons" hidden></div></section>
<div id="status"><span></span><span id="sinfo"></span></div>
</div>
<input type="file" id="fl" accept=".json" hidden>

cylinder:'M3 4c0-1.400 2.200-2 5-2s5 .6 5 2-2.200 2-5 2-5-.6-5-2zM3 4v8c0 1.400 2.200 2 5 2s5-.6 5-2V4',

plane:'M1.500 10L8 6l6.500 4L8 14z',bulb:'M8 1.500a4.500 4.500 0 0 0-2.500 8.200V12h5V9.700A4.500 4.500 0 0 0 8 1.500zM6 14.500h4',

cam:'M1.500 4.500h9v7h-9zM10.500 7l4-2.500v7l-4-2.500',eye:'M1 8s2.500-5 7-5 7 5 7 5-2.500 5-7 5-7-5-7-5zM8 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z',
eyeoff:'M1 8s2.500-5 7-5 7 5 7 5-2.500 5-7 5-7-5-7-5zM2 2l12 12',plus:'M8 3v10M3 8h10',
folder:'M1.500 3.500h4.500L7.500 5h7v8h-13z',terminal:'M2 3h12v10H2zM4.500 6l2 2-2 2M8 10h3',search:'M7 2.500a4.500 4.500 0 1 0 0 9 4.500 4.500 0 0 0 0-9zM10.500 10.500L14 14',
globe:'M8 1.500a6.500 6.500 0 1 0 0 13 6.500 6.500 0 0 0 0-13zM1.500 8h13M8 1.500c3 3 3 10 0 13M8 1.500c-3 3-3 10 0 13',
grid:'M2 2h12v12H2zM6 2v12M10 2v12M2 6h12M2 10h12',magnet:'M3 2v6a5 5 0 0 0 10 0V2h-3v6a2 2 0 0 1-4 0V2z',
chev:'M4 6l4 4 4-4',bolt:'M9 1L3 9h4l-1 6 6-8H8z',gear:'M8 5.500a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5zM8 1.500v2M8 12.500v2M1.500 8h2M12.500 8h2M3.400 3.400l1.400 1.400M11.200 11.200l1.400 1.400M3.400 12.600l1.400-1.400M11.200 4.800l1.400-1.400'};
const ic=n=>`<svg class="i" viewBox="0 0 16 16"><path d="${P[n]}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cap=s=>s[0].toUpperCase()+s.slice(1);
$$('[data-ic]').forEach(e=>e.outerHTML=ic(e.dataset.ic));

/* ---------- state ---------- */
const ents=[];let sel=null,view='scene',tool='translate',playing=false,paused=false,stepReq=false,base='',wire=false,hist=[],hi=-1,snap=false,local=false,frames=0,ft=0;
const env={az:140,el:48,sint:2.4,sh:true,top:'#2a6fd6',hor:'#bcd8f2',gnd:'#3a3d40',size:.03,exp:1,fog:.006,amb:.6,cycle:false,cs:12};
const TYPES=['cube','sphere','cylinder','cone','torus','plane'];
const GEO={cube:()=>new THREE.BoxGeometry(1,1,1),sphere:()=>new THREE.SphereGeometry(.5,32,20),cylinder:()=>new THREE.CylinderGeometry(.5,.5,1,32),cone:()=>new THREE.ConeGeometry(.5,1,32),torus:()=>new THREE.TorusGeometry(.5,.2,16,48),plane:()=>new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2)};

/* ---------- renderer / scene ---------- */

R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0xbcd8f2,.006);
const editCam=new THREE.PerspectiveCamera(55,1,.1,1000);editCam.position.set(7,5,9);
const gameCam=new THREE.PerspectiveCamera(60,1,.1,1000);gameCam.position.set(0,3,10);gameCam.lookAt(0,1,0);scene.add(gameCam);
const sys=[{name:'Main Camera',type:'cam',obj:gameCam,sys:1,active:true},{name:'Directional Light',type:'sun',obj:null,sys:1,active:true}];
gameCam.userData.ent=sys[0];
{const c=[[-.9,-.5],[.9,-.5],[.9,.5],[-.9,.5]],p=[];c.forEach((a,i)=>{const b=c[(i+1)%4];p.push(new THREE.Vector3(0,0,0),new THREE.Vector3(a[0],a[1],-1.5),new THREE.Vector3(a[0],a[1],-1.5),new THREE.Vector3(b[0],b[1],-1.5))});
 var camLines=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:0xdddddd}));gameCam.add(camLines)}

/* skybox shader */
const skyU={sun:{value:new THREE.Vector3(0,1,0)},top:{value:new THREE.Color()},hor:{value:new THREE.Color()},gnd:{value:new THREE.Color()},size:{value:.03},ex:{value:1}};

vertexShader:'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:`uniform vec3 sun,top,hor,gnd;uniform float size,ex;varying vec3 vD;
float hs(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}

c+=vec3(1.,.45,.15)*pow(sd,6.)*dusk*.8*step(-.25,sun.y);
c+=vec3(1.,.95,.85)*smoothstep(1.-size,1.-size*.6,sd)*5.*step(-.05,sun.y);

gl_FragColor=vec4(c*ex,1.);}`}));
sky.renderOrder=-1000;sky.frustumCulled=false;scene.add(sky);

const sun=new THREE.DirectionalLight(0xffffff,2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
{const s=sun.shadow.camera;s.left=s.bottom=-20;s.right=s.top=20;s.far=120}sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;scene.add(sun,sun.target);
const hemi=new THREE.HemisphereLight(0xffffff,0x333333,.5);scene.add(hemi);
const grid=new THREE.GridHelper(40,40,0x777777,0x444444);grid.material.transparent=true;grid.material.opacity=.5;grid.position.y=.003;scene.add(grid);

function applyEnv(){const e=env,el=e.el*D,az=e.az*D,d=new THREE.Vector3(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az));
 const day=THREE.MathUtils.clamp(d.y*3+.5,0,1),k=THREE.MathUtils.clamp(d.y*2.5,0,1);
 sun.position.copy(d).multiplyScalar(50);sun.intensity=e.sint*THREE.MathUtils.clamp(d.y*4,0,1);sun.castShadow=e.sh;sun.color.setRGB(1,.55+.45*k,.3+.7*k);

 skyU.sun.value.copy(d);skyU.top.value.set(e.top);skyU.hor.value.set(e.hor);skyU.gnd.value.set(e.gnd);skyU.size.value=e.size;skyU.ex.value=e.exp;

 if(d.t==='point'){o=new THREE.PointLight(e.color,e.inten,25,1.5);const m=new THREE.Mesh(new THREE.SphereGeometry(.15,12,8),new THREE.MeshBasicMaterial({color:e.color}));o.add(m)}
 else{o=new THREE.Mesh(GEO[d.t](),new THREE.MeshStandardMaterial());o.castShadow=d.t!=='plane';o.receiveShadow=true}
 o.position.fromArray(d.p||[0,.5,0]);o.rotation.set(...(d.r||[0,0,0]));o.scale.fromArray(d.s||[1,1,1]);o.visible=e.active;o.userData.ent=e;e.obj=o;scene.add(o);ents.push(e);applyEnt(e);return e}

function add(t){const e=make({n:cap(t),t,p:[0,t==='plane'?0:t==='point'?3:.5,0]});commit();select(e);log('Created '+e.name)}
function del(e=sel){if(!e||e.sys)return;scene.remove(e.obj);e.obj.geometry&&e.obj.geometry.dispose();ents.splice(ents.indexOf(e),1);log('Deleted '+e.name);select(null);commit()}
function dup(){if(!sel||sel.sys)return;const d=dat(sel);d.n+=' (1)';d.p[0]+=1;const e=make(d);commit();select(e)}
function focus(){if(!sel||!sel.obj)return;const b=new THREE.Box3().setFromObject(sel.obj),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()).length(),d=editCam.position.clone().sub(orbit.target).normalize();orbit.target.copy(c);editCam.position.copy(c).addScaledVector(d,Math.max(s*1.8,3))}

/* serialize / history */
const ser=()=>JSON.stringify({env,ents:ents.map(dat)});
function des(j){const o=JSON.parse(j),si=ents.indexOf(sel),ws=sel&&sel.sys;ents.splice(0).forEach(e=>{scene.remove(e.obj);e.obj.geometry&&e.obj.geometry.dispose()});Object.assign(env,o.env);o.ents.forEach(make);applyEnv();sel=ws?sel:ents[si]||null;setTool(tool);buildHier();buildInsp();buildLight()}

/* ---------- UI builders ---------- */
function buildHier(){const q=$('#hq').value.toLowerCase(),a=all();$('#hier').innerHTML=a.filter(e=>e.name.toLowerCase().includes(q)).map(e=>`<div class="row${e===sel?' sel':''}" data-i="${a.indexOf(e)}">${ic(icn(e))}<span>${esc(e.name)}</span>${e.sys?'':`<span class="eye" data-eye>${ic(e.active?'eye':'eyeoff')}</span>`}</div>`).join('')}
const F=(l,h)=>`<div class="f"><label>${l}</label>${h}</div>`,SL=(a,mn,mx,st,v)=>`<input type=range ${a} min=${mn} max=${mx} step=${st} value=${v}>`;
const V3=(f,a,st)=>`<div class="v3">${['X','Y','Z'].map((n,i)=>`<span class="ax"><b style="color:${['#e5484d','#4cc15a','#4a8ff0'][i]}">${n}</b><input type=number step=${st} data-f=${f} data-i=${i} value="${a[i]}"></span>`).join('')}</div>`;
const CH=(t,i,b,x)=>`<div class="comp"><div class="ch">${ic('chev')}${ic(i)}<span>${t}</span>${x||''}</div><div class="cb">${b}</div></div>`;
const CK=(a,v)=>`<input type=checkbox ${a} ${v?'checked':''}>`,CE=k=>`<input type=color data-e=${k} value="${env[k]}">`;
function buildInsp(){const e=sel,el=$('#insp');if(!e){el.innerHTML='<div class="empty">Nothing selected</div>';return}
 const o=e.obj,r2=a=>a.map(v=>+v.toFixed(3));
 let h=`<div class="oh">${ic(icn(e))}${CK('data-f=act'+(e.sys?' disabled':''),e.active)}<input type=text data-f=name value="${esc(e.name)}"></div>`;
 if(o)h+=CH('Transform','move',F('Position',V3('pos',r2(o.position.toArray()),.1))+F('Rotation',V3('rot',r2(o.rotation.toArray().slice(0,3).map(v=>v/D)),1))+(e.type==='cam'?'':F('Scale',V3('scl',r2(o.scale.toArray()),.1))));
 if(e.type==='cam')h+=CH('Camera','cam',F('Field of View',SL('data-f=fov',20,120,1,gameCam.fov))+F('Clipping','0.1 – 1000'));
 if(e.type==='sun')h+=CH('Directional Light','sun',F('Intensity',SL('data-e=sint',0,6,.1,env.sint))+F('Azimuth',SL('data-e=az',0,360,1,env.az))+F('Elevation',SL('data-e=el',0,360,1,env.el))+F('Shadows',CK('data-e=sh',env.sh)));
 if(!e.sys&&e.type!=='point')h+=CH('Mesh Renderer','cube',F('Color',`<input type=color data-f=color value="${e.color}">`)+F('Roughness',SL('data-f=rough',0,1,.01,e.rough))+F('Metalness',SL('data-f=metal',0,1,.01,e.metal)));
 if(e.type==='point')h+=CH('Light','bulb',F('Color',`<input type=color data-f=color value="${e.color}">`)+F('Intensity',SL('data-f=inten',0,10,.1,e.inten)));
 if(e.rb)h+=CH('Rigidbody','bolt',F('Use Gravity',CK('disabled',1)),`<span class="x" data-rm="rb">${ic('plus')}</span>`);
 if(e.rotor)h+=CH('Rotator (Script)','bolt',F('Speed °/s',SL('data-f=spin',-360,360,5,e.spin)),`<span class="x" data-rm="rotor">${ic('plus')}</span>`);
 if(!e.sys)h+=`<div class="cb"><select id="addc"><option value="">Add Component</option>${e.type!=='point'&&!e.rb?'<option value="rb">Rigidbody</option>':''}${!e.rotor?'<option value="rotor">Rotator (Script)</option>':''}</select></div>`;
 el.innerHTML=h}
function buildLight(){$('#light').innerHTML=CH('Skybox / Environment','sun',F('Sky Top',CE('top'))+F('Horizon',CE('hor'))+F('Ground',CE('gnd'))+F('Sun Size',SL('data-e=size',.005,.12,.005,env.size))+F('Exposure',SL('data-e=exp',.2,3,.05,env.exp)))
 +CH('Sun & Time of Day','sun',F('Intensity',SL('data-e=sint',0,6,.1,env.sint))+F('Azimuth',SL('data-e=az',0,360,1,env.az))+F('Time of Day',SL('data-e=el',0,360,1,env.el))+F('Shadows',CK('data-e=sh',env.sh))+F('Day Cycle',CK('data-e=cycle',env.cycle))+F('Cycle Speed',SL('data-e=cs',1,60,1,env.cs))
 +F('Presets','<div class="btns">'+[['Sunrise',6],['Noon',70],['Sunset',174],['Night',250]].map(p=>`<button data-pre="${p[1]}">${p[0]}</button>`).join('')+'</div>'))
 +CH('Fog & Ambient','grid',F('Fog Density',SL('data-e=fog',0,.05,.001,env.fog))+F('Ambient',SL('data-e=amb',0,2,.05,env.amb)))}

/* ---------- events ---------- */
$('#hier').onclick=ev=>{const r=ev.target.closest('.row');if(!r)return;const e=all()[+r.dataset.i];if(ev.target.closest('[data-eye]')){e.active=!e.active;e.obj.visible=e.active;buildHier();buildInsp();commit();return}select(e)};
$('#hier').ondblclick=ev=>{const r=ev.target.closest('.row');if(!r)return;const e=all()[+r.dataset.i];if(e.sys)return;const n=prompt('Rename',e.name);if(n){e.name=n;buildHier();buildInsp();commit()}};
$('#hq').oninput=buildHier;$('#hadd').onclick=()=>add('cube');
$('#insp').addEventListener('input',ev=>{const t=ev.target,f=t.dataset.f;if(!f||!sel)return;const v=t.type==='checkbox'?t.checked:t.type==='text'||t.type==='color'?t.value:parseFloat(t.value),o=sel.obj,i=+t.dataset.i;
 if(f==='pos')o.position.setComponent(i,v||0);
 else if(f==='rot'){const a=o.rotation.toArray().slice(0,3);a[i]=(v||0)*D;o.rotation.set(...a)}
 else if(f==='scl')o.scale.setComponent(i,v||.001);
 else if(f==='name'){sel.name=v;buildHier()}
 else if(f==='act'){sel.active=v;o.visible=v;buildHier()}
 else if(f==='fov'){gameCam.fov=v;gameCam.updateProjectionMatrix()}
 else{sel[f]=v;applyEnt(sel)}});
$('#insp').addEventListener('click',ev=>{const r=ev.target.closest('[data-rm]');if(!r||!sel)return;if(r.dataset.rm==='rb'){sel.rb=false}else sel.rotor=false;buildInsp();commit()});
$('#insp').addEventListener('change',ev=>{const t=ev.target;if(t.id==='addc'&&t.value&&sel){if(t.value==='rb')sel.rb=true;else sel.rotor=true;log(`Added ${t.value==='rb'?'Rigidbody':'Rotator'} to ${sel.name}`);buildInsp();commit()}});
document.addEventListener('input',ev=>{const t=ev.target,k=t.dataset.e;if(!k)return;env[k]=t.type==='checkbox'?t.checked:t.type==='color'?t.value:parseFloat(t.value);applyEnv();
 $$(`[data-e=${k}]`).forEach(i=>{if(i!==t){if(i.type==='checkbox')i.checked=env[k];else i.value=env[k]}})});
document.addEventListener('change',ev=>{const t=ev.target;if((t.dataset.e||t.dataset.f)&&t.type!=='text')commit()});
$('#light').addEventListener('click',ev=>{const b=ev.target.closest('[data-pre]');if(!b)return;env.el=+b.dataset.pre;applyEnv();$$('[data-e=el]').forEach(i=>i.value=env.el);commit()});
$('#proj').innerHTML='<div class="assets">'+[...TYPES,'point'].map(t=>`<div class="tile" data-add="${t}">${ic(t==='point'?'bulb':t)}<span>${cap(t)}</span></div>`).join('')+'</div>';
$('#proj').onclick=ev=>{const t=ev.target.closest('[data-add]');if(t)add(t.dataset.add)};
$$('[data-v]').forEach(t=>t.onclick=()=>setView(t.dataset.v));
$$('[data-p]').forEach(t=>t.onclick=()=>{$$('[data-p]').forEach(x=>x.classList.toggle('on',x===t));$('#insp').hidden=t.dataset.p!=='insp';$('#light').hidden=t.dataset.p!=='light'});
function tabB(n){$$('[data-b]').forEach(t=>t.classList.toggle('on',t.dataset.b===n));$('#proj').hidden=n!=='proj';$('#cons').hidden=n!=='cons'}
$$('[data-b]').forEach(t=>t.onclick=()=>tabB(t.dataset.b));

/* picking */
let down=null;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,g:!!gizmo.axis}});
cv.addEventListener('pointerup',e=>{if(!down||e.button!==0||down.g||view!=='scene'||tool==='hand'||Math.hypot(e.clientX-down.x,e.clientY-down.y)>4)return;
 const r=cv.getBoundingClientRect(),rc=new THREE.Raycaster();rc.params.Line.threshold=.15;rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),editCam);
 const h=rc.intersectObjects([...ents.filter(x=>x.active).map(x=>x.obj),gameCam],true)[0];let o=h&&h.object;while(o&&!o.userData.ent)o=o.parent;select(o?o.userData.ent:null)});

/* toolbar + menus */
$('#toolbar').innerHTML=`<div class="grp">${[['hand','hand','Hand (Q)'],['translate','move','Move (W)'],['rotate','rotate','Rotate (E)'],['scale','scale','Scale (R)']].map(t=>`<button class="tb" data-tool="${t[0]}" title="${t[2]}">${ic(t[1])}</button>`).join('')}</div>
<div class="grp"><button class="tb" id="bsp">${ic('globe')}Global</button><button class="tb" id="bsn">${ic('magnet')}Snap</button></div><div class="grow"></div>
<div class="grp"><button class="tb" id="bplay" title="Play">${ic('play')}</button><button class="tb" id="bpause" title="Pause">${ic('pause')}</button><button class="tb" id="bstep" title="Step">${ic('step')}</button></div><div class="grow"></div>
<div class="grp"><button class="tb" id="bwire">${ic('grid')}Wireframe</button></div>`;
$$('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('#bsp').onclick=e=>{local=!local;gizmo.setSpace(local?'local':'world');e.currentTarget.innerHTML=ic('globe')+(local?'Local':'Global')};
$('#bsn').onclick=e=>{snap=!snap;e.currentTarget.classList.toggle('on',snap);gizmo.setTranslationSnap(snap?.5:null);gizmo.setRotationSnap(snap?15*D:null);gizmo.setScaleSnap(snap?.1:null)};
$('#bwire').onclick=e=>{wire=!wire;e.currentTarget.classList.toggle('on',wire);ents.forEach(applyEnt)};
$('#bplay').onclick=()=>playing?stop():play();
$('#bpause').onclick=e=>{if(!playing)return;paused=!paused;e.currentTarget.classList.toggle('on',paused)};
$('#bstep').onclick=()=>{if(playing){paused=true;$('#bpause').classList.add('on');stepReq=true}};
function play(){base=ser();playing=true;paused=false;setView('game');document.body.classList.add('playing');$('#bplay').classList.add('on');$('#bplay').innerHTML=ic('cube');log('Entered Play Mode')}
function stop(){playing=false;paused=false;des(base);document.body.classList.remove('playing');$('#bplay').classList.remove('on');$('#bpause').classList.remove('on');$('#bplay').innerHTML=ic('play');setView('scene');log('Exited Play Mode')}
function sim(dt){const st=ents.filter(e=>!e.rb&&e.active&&e.obj.isMesh).map(e=>new THREE.Box3().setFromObject(e.obj));
 ents.forEach(e=>{if(!e.active)return;const o=e.obj;if(e.rotor)o.rotation.y+=e.spin*D*dt;if(!e.rb)return;
  e.vel-=9.81*dt;o.position.y+=e.vel*dt;const b=new THREE.Box3().setFromObject(o);
  for(const s of st)if(e.vel<=0&&b.max.x>s.min.x&&b.min.x<s.max.x&&b.max.z>s.min.z&&b.min.z<s.max.z&&b.min.y<s.max.y&&b.min.y>s.max.y-.6){o.position.y+=s.max.y-b.min.y;e.vel=Math.abs(e.vel)>1.5?-e.vel*.45:0;b.setFromObject(o)}})}
const MENUS={File:[['New Scene',newScene],['Save Scene (.json)',saveScene],['Load Scene…',()=>$('#fl').click()],0,['Export Screenshot',shot]],
 Edit:[['Undo   Ctrl+Z',undo],['Redo   Ctrl+Y',redo],0,['Duplicate   Ctrl+D',dup],['Delete   Del',()=>del()],['Frame Selected   F',focus]],
 GameObject:[...TYPES.map(t=>[cap(t),()=>add(t)]),0,['Point Light',()=>add('point')]],
 Window:[['Console',()=>tabB('cons')],['Project',()=>tabB('proj')]],Help:[['About Apex Engine',()=>log('Apex Engine · Three.js r128 · Q/W/E/R tools, F focus, RMB orbit, MMB pan')]]};
$('#menubar').innerHTML=Object.keys(MENUS).map(k=>`<div class="menu">${k}<div class="dd">${MENUS[k].map((m,i)=>m?`<div data-m="${k}|${i}">${m[0]}</div>`:'<hr>').join('')}</div></div>`).join('');
$('#menubar').onclick=ev=>{const t=ev.target.closest('[data-m]');if(!t)return;const[k,i]=t.dataset.m.split('|');MENUS[k][i][1]()};
function newScene(){des(JSON.stringify({env,ents:[]}));select(null);commit();log('New scene')}
function saveScene(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ser()],{type:'application/json'}));a.download='scene.json';a.click();log('Scene saved')}
$('#fl').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{try{des(t);commit();log('Loaded '+f.name)}catch(x){log('Load failed: '+x.message,'err')}})};
function shot(){R.render(scene,view==='game'?gameCam:editCam);const a=document.createElement('a');a.href=cv.toDataURL();a.download='screenshot.png';a.click()}
function log(m,t='info'){const d=document.createElement('div');d.className='ln '+t;d.textContent=`[${new Date().toLocaleTimeString()}] ${m}`;$('#cons').appendChild(d);$('#cons').scrollTop=1e9;$('#status').firstChild.textContent=m}
onerror=(m)=>log(String(m),'err');
addEventListener('keydown',e=>{const t=e.target;if(t.tagName==='SELECT'||t.tagName==='INPUT'&&(t.type==='text'||t.type==='number'))return;const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
 if(c){if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='y'){e.preventDefault();redo()}else if(k==='d'){e.preventDefault();dup()}else if(k==='s'){e.preventDefault();saveScene()}return}
 if(k==='delete'||k==='backspace')del();else if(k==='q')setTool('hand');else if(k==='w')setTool('translate');else if(k==='e')setTool('rotate');else if(k==='r')setTool('scale');else if(k==='f')focus()});
new ResizeObserver(()=>{const w=vp.clientWidth,h=vp.clientHeight;R.setSize(w,h);editCam.aspect=gameCam.aspect=w/h;editCam.updateProjectionMatrix();gameCam.updateProjectionMatrix()}).observe(vp);

/* ---------- loop ---------- */
const clock=new THREE.Clock(),AX=[[1,0,0,'#e5484d','X'],[0,1,0,'#4cc15a','Y'],[0,0,1,'#4a8ff0','Z']];
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.1),g=view==='game',cam=g?gameCam:editCam;
 if(env.cycle){env.el=(env.el+env.cs*dt)%360;applyEnv();$$('[data-e=el]').forEach(i=>i.value=env.el.toFixed(1))}
 if(playing&&(!paused||stepReq)){sim(stepReq?1/60:dt);stepReq=false}
 sky.position.copy(cam.position);orbit.update();
 grid.visible=camLines.visible=!g;gizmo.visible=!g&&!!gizmo.object;ents.forEach(e=>{if(e.type==='point')e.obj.children[0].visible=!g&&e.active});
 R.render(scene,cam);
 if(!g){const q=editCam.quaternion.clone().invert();$('#axg').innerHTML=AX.map(a=>({a,v:new THREE.Vector3(a[0],a[1],a[2]).applyQuaternion(q)})).sort((x,y)=>x.v.z-y.v.z).map(({a,v})=>{const x=35+v.x*24,y=35-v.y*24;return`<line x1="35" y1="35" x2="${x}" y2="${y}" stroke="${a[3]}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="7" fill="${a[3]}"/><text x="${x}" y="${y+3.5}" font-size="9" font-weight="700" fill="#111" text-anchor="middle">${a[4]}</text>`}).join('')}
 frames++;ft+=dt;if(ft>=.5){$('#stats').textContent=`${Math.round(frames/ft)} FPS · ${R.info.render.triangles.toLocaleString()} tris · ${ents.length} objects`;frames=0;ft=0}}

/* ---------- boot ---------- */
applyEnv();buildLight();
make({n:'Ground',t:'plane',p:[0,0,0],s:[40,1,40],c:'#6b7a55',ro:.95,me:0});
make({n:'Cube',t:'cube',p:[-2.5,.5,0],c:'#c0553d'});
make({n:'Chrome Sphere',t:'sphere',p:[0,.5,1],c:'#e9c46a',ro:.2,me:.9});
make({n:'Cylinder',t:'cylinder',p:[2.5,.5,-.5],c:'#4a8fd0'});
make({n:'Spinner',t:'torus',p:[0,2.5,-2],r:[1.2,0,0],c:'#b57edc',ro:.3,me:.6,sp:60});
make({n:'Falling Ball',t:'sphere',p:[-.5,6,.5],c:'#f4f4f4',rb:true});
commit();setTool('translate');setView('scene');buildHier();buildInsp();log('Apex Engine ready. Press Play to simulate.');frame();
</script></body></html>
